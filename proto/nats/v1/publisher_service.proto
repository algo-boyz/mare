syntax = "proto3";

package nats.v1;

option cc_enable_arenas = true;

import "audio/v1/transcript.proto";
import "common/v1/error.proto";
import "detection/v1/detection.proto";

// Owns the NATS / JetStream connection and publishes domain events.
service NatsPublisherService {
  rpc PublishAlert(PublishAlertRequest) returns (PublishAlertResponse);
  rpc PublishTranscript(PublishTranscriptRequest) returns (PublishTranscriptResponse);
}

message PublishAlertRequest {
  detection.v1.Alert alert = 1;
  string subject = 2;          // optional, default "cv.alert"
}

message PublishAlertResponse {
  bool   published = 1;
  string subject   = 2;
  uint64 sequence  = 3;        // JetStream sequence
  common.v1.DomainError error = 4;
}

message PublishTranscriptRequest {
  audio.v1.Transcript transcript = 1;
  string subject = 2;  // default "audio.transcript"
}

message PublishTranscriptResponse {
  bool   published = 1;
  string subject   = 2;
  uint64 sequence  = 3;
  common.v1.DomainError error = 4;
}