services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats-publisher:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/app/nats_publisher"]
    environment:
      NATS_URL: nats://nats:4222
      GRPC_ADDR: 0.0.0.0:50051
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_ENVIRONMENT: docker
    depends_on:
      nats:
        condition: service_healthy
    ports:
      - "50051:50051"

  ingest:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/app/ingest_server"]
    environment:
      GRPC_ADDR: 0.0.0.0:50052
      PUBLISHER_ADDR: nats-publisher:50051
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_ENVIRONMENT: docker
    depends_on:
      - nats-publisher
      - otel-collector
    ports:
      - "50052:50052"

  consumer:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/app/consumer"]
    environment:
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_ENVIRONMENT: docker
    depends_on:
      - nats-publisher
      - otel-collector

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "pass"
      CLICKHOUSE_DB: default
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    # optional persistence
    # volumes:
    #   - clickhouse-data:/var/lib/clickhouse

  clickhouse-consumer:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/app/clickhouse_consumer"]
    restart: unless-stopped
    environment:
      NATS_URL: nats://nats:4222
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "pass"
      CLICKHOUSE_DB: default
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_ENVIRONMENT: docker
    depends_on:
      clickhouse:
        condition: service_healthy
      nats-publisher:
        condition: service_started
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # gRPC
      - "4318:4318"   # HTTP

  video_server:
    build:
      context: .
      dockerfile: docker/Dockerfile.video
    command: ["/app/video_server"]
    environment:
      GRPC_ADDR: 0.0.0.0:50053
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "pass"
      CLICKHOUSE_DB: default
      VIDEO_ROOT: /app/assets
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_ENVIRONMENT: docker
    ports:
      - "50053:50053"
    volumes:
      - ./assets:/app/assets:ro
    depends_on:
      clickhouse:
        condition: service_healthy

  # ── optional clients (profiles) ──────────────────────────

  # Vision / CV client
  #   docker compose --profile client run --rm cv-client /app/assets/sample.mp4 /app/models/yolo11n.onnx
  cv-client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    profiles: ["client"]
    environment:
      INGEST_ADDR: ingest:50052
      EDGE_FORCE_CPU: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_ENVIRONMENT: docker
    depends_on:
      - ingest
      - otel-collector
    volumes:
      - ${VIDEO_FILE:-./assets/sample.mp4}:/app/assets/sample.mp4:ro
    # Uncomment on Linux to pass a webcam through:
    # devices:
    #   - /dev/video0:/dev/video0

  # Audio / STT client
  #   docker compose --profile audio up audio-client
  # or one-shot:
  #   docker compose --profile audio run --rm audio-client
  audio-client:
    build:
      context: .
      dockerfile: docker/Dockerfile.audio
    profiles: ["audio"]
    environment:
      LIVE_ADDR: 0.0.0.0:50054
      INGEST_ADDR: ingest:50052
      SOURCE: ${AUDIO_SOURCE:-mic}          # mic | file | …
      INGEST_FINALS: "1"
      PRINT_PARTIAL: "1"
      SHERPA_MODEL_DIR: /app/models/sherpa-onnx-streaming-zipformer-en-2023-06-26
      SHERPA_PROVIDER: cpu
      SHERPA_THREADS: "2"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_ENVIRONMENT: docker
    ports:
      - "50054:50054"                       # AudioLiveService
    depends_on:
      - ingest
      - otel-collector
    # Optional: mount model from host instead of baking it into the image
    # volumes:
    #   - ./models/sherpa-onnx-streaming-zipformer-en-2023-06-26:/app/models/sherpa-onnx-streaming-zipformer-en-2023-06-26:ro
    # Linux: give the container access to the host microphone
    # devices:
    #   - /dev/snd:/dev/snd
    # or with PulseAudio / PipeWire:
    # volumes:
    #   - /run/user/1000/pulse:/run/user/1000/pulse
    # environment:
    #   PULSE_SERVER: unix:/run/user/1000/pulse/native

volumes:
  clickhouse-data: